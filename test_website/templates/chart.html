<!DOCTYPE html>
<link  rel="stylesheet" href="{{ url_for('static', filename='chart.css') }}" />
<script src="https://s3.tradingview.com/tv.js"></script>
<script src="{{ url_for('static', filename='chart.js') }}"></script>

<html>
<head>
    <title>Trading Chart</title>
  
</head>
<body>
    <header class="header_stroke">
        <div class="header_logo" style="top: 0px; left: 0px;">
            <p class="header_logo_tekst" id="header_logo">HTPS</p>
        </div>
        <div class="header_links">
            <p style="position: absolute; top: 17.5px; right: 30.5px">ACCOUNT</p>
        </div>
        <div class="header_links">
            <p style="position: absolute; top: 17.5px; right: 180.5px">PORTFOLIO</p>
        </div>
        <div class="header_links">
            <p style="position: absolute; top: 17.5px; right: 337.5px">TRADING</p>
        </div>
        <div class="gray_line_horizontal"></div>
    </header>

    <section>
        <div id="chart"></div>
    </section>

    <section class="trading-form-section">
        <div class="trading-form">
            <!-- Buy/Sell Tabs -->
            <div class="form-tabs">
                <button class="tab-button active" data-tab="buy">Buy</button>
                <button class="tab-button" data-tab="sell">Sell</button>
            </div>

            <!-- Form Content -->
            <div class="form-content">
                <!-- Symbol -->
                <div class="form-group">
                    <label for="symbol">Symbol</label>
                    <input type="text" id="symbol" name="symbol" value="AAPL" class="form-input">
                </div>

                <!-- Market Price -->
                <div class="form-group">
                    <label>Market Price</label>
                    <span class="market-price">$213.92</span>
                </div>

                <!-- Quantity -->
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" value="1" class="form-input">
                </div>

                <!-- Order Type -->
                <div class="form-group">
                    <label for="order-type">Order Type</label>
                    <select id="order-type" name="order_type" class="form-select">
                        <option value="market" selected>Market</option>
                        <option value="limit">Limit</option>
                        <option value="stop">Stop</option>
                    </select>
                </div>

                <!-- Time in Force -->
                <div class="form-group">
                    <label for="time-force">Time in Force</label>
                    <select id="time-force" name="time_in_force" class="form-select">
                        <option value="day" selected>DAY</option>
                        <option value="gtc">GTC</option>
                        <option value="ioc">IOC</option>
                    </select>
                </div>

                <!-- Estimated Cost -->
                <div class="form-group cost-info">
                    <span class="cost-label">Estimated Cost</span>
                    <span class="cost-value">$213.92</span>
                </div>

                <!-- Buying Power -->
                <div class="form-group cost-info">
                    <span class="cost-label">Buying Power</span>
                    <span class="cost-value">–</span>
                </div>

                <!-- Review Order Button -->
                <button type="submit" class="review-button">Review Order</button>
            </div>
        </div>
    </section>

    <!-- Voeg dit toe onder je chart sectie -->
    <section class="portfolio-section">
        <div class="portfolio-container">
            <!-- Tab Navigation -->
            <div class="portfolio-tabs">
                <button class="portfolio-tab active" data-tab="position">Position</button>
                <button class="portfolio-tab" data-tab="orders">Orders</button>
            </div>

            <!-- Portfolio Table -->
            <div class="portfolio-table-container">
                <table class="portfolio-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Qty</th>
                            <th>Market Value</th>
                            <th>Avg Entry</th>
                            <th>Cost Basis</th>
                            <th>Today's P/L (%)</th>
                            <th>Today's P/L ($)</th>
                            <th>Total P/L (%)</th>
                            <th>Total P/L ($)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="no-positions">
                            <td colspan="10">No positions found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
    <img src="{{ url_for('static', filename='images/capitant-logo.png') }}" alt="Chart logo" class="bottom-logo">
    <div class="gray_line_vertical_right"></div>
    <div class="gray_line_vertical_left"></div>
</body>
</html>
